[package]
name = "newbeelauncher"
version = "0.1.0"
edition = "2021"
description = "NewBee Launcher - a Rust Minecraft launcher with persistent accounts, per-instance isolation and one-click mod/loader installs"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
quick-xml = "0.36"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
urlencoding = "2"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.18.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[[bin]]
name = "nbl"
path = "src/main.rs"

[[bin]]
name = "nbl-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
