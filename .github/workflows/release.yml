name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup target add x86_64-pc-windows-gnu
          rustup override set stable-x86_64-pc-windows-gnu

      - name: Install MinGW (linker)
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        shell: pwsh

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "0.1.0" }
          $dir = "dist/NewBeeLauncher-$ver-win64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/nbl.exe $dir
          Copy-Item target/release/nbl-cli.exe $dir
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/NewBeeLauncher-$ver-win64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true